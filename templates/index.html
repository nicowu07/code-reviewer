<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Reviewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg-top: #f8fbff;
      --bg-bottom: #fff4ea;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f1c2e;
      --muted: #4c596d;
      --accent: #0077ff;
      --accent-hover: #005fd1;
      --border: #d9e2f2;
      --shadow: 0 20px 40px rgba(25, 64, 122, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Outfit", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #d6ecff 0%, transparent 48%),
        radial-gradient(circle at 100% 100%, #ffe7cc 0%, transparent 42%),
        linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      display: flex;
      justify-content: center;
      padding: 26px;
    }

    .container {
      width: min(980px, 100%);
      animation: fade-in 0.45s ease;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 18px;
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .editor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    label {
      display: block;
      font-size: 0.94rem;
      font-weight: 700;
      color: #214368;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 360px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      padding: 14px;
      border: 1px solid #cfdcf2;
      border-radius: 12px;
      background: #fdfefe;
      color: #12243f;
      resize: vertical;
      outline: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    textarea:focus {
      border-color: #9ec3ff;
      box-shadow: 0 0 0 4px rgba(0, 119, 255, 0.14);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .hint {
      color: #51627a;
      font-size: 0.88rem;
      margin: 0;
    }

    button {
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.2px;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
      border: 1px solid #ffd89b;
      background: #fff7ea;
      color: #7a4a00;
    }

    .tab-bar {
      text-align: center;
    }

    .tab-btn {
      background-color: #fff;
      color:#005fd1;
      border-radius: 10px 10px 0 0;
    }
    
    .tab-btn:hover {
    background-color: #b8cce8;
    transform: translateY(-1px);
    }
    .active {
      background-color: #cfdcf2;
    }
    .file-btn {
    display: inline-block;
    cursor: pointer;
    background-color: #f2f6ff;
    color: #1b3f7a;
    border: 1px solid #ceddf5;
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: all 0.2s ease;
    }

    .btn {
      text-decoration: none;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.2px;
      border-radius: 10px;
      padding: 10px 14px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: #f2f6ff;
      color: #1b3f7a;
      border-color: #ceddf5;
    }

    .file-btn:hover {
    background-color: #dce8ff;
    transform: translateY(-1px);
    }

    .file-upload-area {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border: 2px dashed #cfdcf2;
    border-radius: 12px;
    margin-bottom: 14px;
    }

    .hero-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      .hero,
      .editor-card {
        padding: 14px;
      }

      textarea {
        min-height: 280px;
      }
    }
  </style>
<script>
  function showTab(tabName) {
    // hide all tabs
    document.getElementById('paste-tab').style.display = 'none'
    document.getElementById('upload-tab').style.display = 'none'
    // show selected tab
    document.getElementById(tabName).style.display = 'block'
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'))
    document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active')
    //change the file name when uploaded
    document.getElementById('file-input').addEventListener('change', function() {
    const fileName = this.files[0] ? this.files[0].name : 'No file chosen'
    document.getElementById('file-name').textContent = fileName
})
  }
</script>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="hero-header">
        <h1>Code Security Reviewer</h1>
        <a class="btn" href="/dashboard">Go to Dashboard</a>
      </div>
      <p class="subtitle">Paste your Python code or upload a file and get a security report!</p>
    </section>
    {% if result %}
      <div class="result">{{ result }}</div>
    {% endif %}
    <div class="tab-bar">
      <button onclick="showTab('paste-tab')" class="tab-btn active">Paste Code</button>
      <button onclick="showTab('upload-tab')" class="tab-btn">Upload File</button>
    </div>
    <div id="paste-tab" style="display: block;">
      <section class="editor-card">
        <form action="/review" method="post">
          <label for="code">Your Python Code</label>
          <textarea id="code" name="code" placeholder="Paste your Python code here...">{{ code }}</textarea>
          <div class="actions">
            <p class="hint">Max input size: 100,000 characters.</p>
            <button type="submit">Review Code</button>
          </div>
        </form>
      </section>
    </div>
    <div id="upload-tab" style="display: none;">
      <section class="upload-card editor-card">
        <form action="/review" method="post" enctype="multipart/form-data">
          <div class="file-upload-area">
            <input type="file" name="file" style="display:none" accept=".py,.ipynb" id="file-input">
            <label for="file-input" class="file-btn">Choose File</label>
            <span id="file-name">No file chosen</span>
          </div>
          <div class="actions">
            <p class="hint">Accepted: .py and .ipynb files only</p>
            <button type="submit">Review Code</button>
          </div>
          
        </form>
      </section>
    </div>

  </main>
</body>
</html>
